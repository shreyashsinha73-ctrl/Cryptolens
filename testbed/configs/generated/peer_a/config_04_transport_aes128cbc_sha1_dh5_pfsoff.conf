# ==============================================================================
# CryptoLens strongSwan swanctl.conf Template
# Parameterized for Peer A and Peer B across 6 Core Configurations
# ==============================================================================

connections {
    config_04_transport_aes128cbc_sha1_dh5_pfsoff {
        local_addrs = 10.10.0.1
        remote_addrs = 10.10.0.2

        local {
            auth = psk
            id = peer_a@config_04_transport_aes128cbc_sha1_dh5_pfsoff.cryptolens.local
        }
        remote {
            auth = psk
            id = peer_b@config_04_transport_aes128cbc_sha1_dh5_pfsoff.cryptolens.local
        }

        children {
            child_config_04_transport_aes128cbc_sha1_dh5_pfsoff {
                mode = transport
                local_ts = 10.10.0.1/32
                remote_ts = 10.10.0.2/32
                esp_proposals = aes128-sha1
                rekey_time = 28800s
                dpd_action = none
                start_action = none
                updown = /bin/true
            }
        }

        version = 2
        proposals = aes128-sha1-modp1536
        rekey_time = 28800s
        dpd_delay = 0s
        encap = no
    }
}

secrets {
    ike-psk-config_04_transport_aes128cbc_sha1_dh5_pfsoff {
        secret = "CryptoLens_SIH2026_GroundTruthKey!"
    }
}