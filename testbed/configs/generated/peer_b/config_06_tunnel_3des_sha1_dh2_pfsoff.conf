# ==============================================================================
# CryptoLens strongSwan swanctl.conf Template
# Parameterized for Peer A and Peer B across 6 Core Configurations
# ==============================================================================

connections {
    config_06_tunnel_3des_sha1_dh2_pfsoff {
        local_addrs = 10.10.0.2
        remote_addrs = 10.10.0.1

        local {
            auth = psk
            id = peer_b@config_06_tunnel_3des_sha1_dh2_pfsoff.cryptolens.local
        }
        remote {
            auth = psk
            id = peer_a@config_06_tunnel_3des_sha1_dh2_pfsoff.cryptolens.local
        }

        children {
            child_config_06_tunnel_3des_sha1_dh2_pfsoff {
                mode = tunnel
                local_ts = 192.168.2.0/24
                remote_ts = 192.168.1.0/24
                esp_proposals = 3des-sha1
                rekey_time = 86400s
                dpd_action = none
                start_action = none
                updown = /bin/true
            }
        }

        version = 2
        proposals = 3des-sha1-modp1024
        rekey_time = 86400s
        dpd_delay = 0s
        encap = no
    }
}

secrets {
    ike-psk-config_06_tunnel_3des_sha1_dh2_pfsoff {
        secret = "CryptoLens_SIH2026_GroundTruthKey!"
    }
}