# ==============================================================================
# CryptoLens strongSwan swanctl.conf Template
# Parameterized for Peer A and Peer B across 6 Core Configurations
# ==============================================================================

connections {
    config_02_tunnel_aes128gcm_dh14_pfson {
        local_addrs = 10.10.0.2
        remote_addrs = 10.10.0.1

        local {
            auth = psk
            id = peer_b@config_02_tunnel_aes128gcm_dh14_pfson.cryptolens.local
        }
        remote {
            auth = psk
            id = peer_a@config_02_tunnel_aes128gcm_dh14_pfson.cryptolens.local
        }

        children {
            child_config_02_tunnel_aes128gcm_dh14_pfson {
                mode = tunnel
                local_ts = 192.168.2.0/24
                remote_ts = 192.168.1.0/24
                esp_proposals = aes128gcm16-modp2048
                rekey_time = 7200s
                dpd_action = none
                start_action = none
                updown = /bin/true
            }
        }

        version = 2
        proposals = aes128gcm16-prfsha256-modp2048
        rekey_time = 7200s
        dpd_delay = 0s
        encap = no
    }
}

secrets {
    ike-psk-config_02_tunnel_aes128gcm_dh14_pfson {
        secret = "CryptoLens_SIH2026_GroundTruthKey!"
    }
}