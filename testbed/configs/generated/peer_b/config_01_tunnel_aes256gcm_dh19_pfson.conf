# ==============================================================================
# CryptoLens strongSwan swanctl.conf Template
# Parameterized for Peer A and Peer B across 6 Core Configurations
# ==============================================================================

connections {
    config_01_tunnel_aes256gcm_dh19_pfson {
        local_addrs = 10.10.0.2
        remote_addrs = 10.10.0.1

        local {
            auth = psk
            id = peer_b@config_01_tunnel_aes256gcm_dh19_pfson.cryptolens.local
        }
        remote {
            auth = psk
            id = peer_a@config_01_tunnel_aes256gcm_dh19_pfson.cryptolens.local
        }

        children {
            child_config_01_tunnel_aes256gcm_dh19_pfson {
                mode = tunnel
                local_ts = 192.168.2.0/24
                remote_ts = 192.168.1.0/24
                esp_proposals = aes256gcm16-ecp256
                rekey_time = 3600s
                dpd_action = none
                start_action = none
                updown = /bin/true
            }
        }

        version = 2
        proposals = aes256gcm16-prfsha256-ecp256
        rekey_time = 3600s
        dpd_delay = 0s
        encap = no
    }
}

secrets {
    ike-psk-config_01_tunnel_aes256gcm_dh19_pfson {
        secret = "CryptoLens_SIH2026_GroundTruthKey!"
    }
}