name: CryptoLens v2 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install system dependencies (tshark, strongSwan swanctl)
      run: |
        sudo apt-get update
        sudo apt-get install -y tshark strongswan strongswan-swanctl strongswan-starter libcap2-bin

    - name: Start strongSwan charon daemon
      run: |
        sudo systemctl start strongswan 2>/dev/null || sudo systemctl start strongswan-starter 2>/dev/null || sudo ipsec start 2>/dev/null || sudo /usr/lib/strongswan/charon 2>/dev/null &
        for i in $(seq 1 10); do
          if [ -S /var/run/charon.vici ]; then
            echo "Charon VICI socket is active at /var/run/charon.vici"
            break
          fi
          sleep 1
        done
        sudo chmod 666 /var/run/charon.vici 2>/dev/null || true
        swanctl --version || true

    - name: Install CPU-only PyTorch and Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
        pip install -r requirements.txt
        pip install pytest pytest-asyncio anyio

    - name: Run pytest test suite
      run: |
        pytest -v -rs tests scripts backend/scripts

    - name: Run 5-stage defense demo audit
      run: |
        bash scripts/demo_audit.sh
